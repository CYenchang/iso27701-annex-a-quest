<style>
/* Layout: one phone-width column for learners (stage → task card → feedback); a wider projector layout at #host. Controller = indigo, processor = teal, everywhere. */
:root{
  --paper:#ECEFF3; --card:#FFFFFF; --ink:#17202B; --muted:#596474; --line:#CED4DC;

  --accent:#B2361E; --accent-soft:#F8E4DF; --good:#18794A; --good-soft:#DFF3E7; --bad:#B42318; --bad-soft:#FBE3E1;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ctrl:#94A7F3; --ctrl-soft:#232C4A; --proc:#56C9B4; --proc-soft:#173A35;
  --accent:#F08066; --accent-soft:#3A221D; --good:#55C783; --good-soft:#173527; --bad:#F2806F; --bad-soft:#3D1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --card:#18202A; --ink:#E7EBF1; --muted:#9BA6B4; --line:#2D3746;
  --ctrl:#94A7F3; --ctrl-soft:#232C4A; --proc:#56C9B4; --proc-soft:#173A35;
  --accent:#F08066; --accent-soft:#3A221D; --good:#55C783; --good-soft:#173527; --bad:#F2806F; --bad-soft:#3D1F1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap.wide{max-width:1040px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.01em}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top .who{font-size:13px;color:var(--muted)}
.score-pill{font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}

/* level track: five stamps */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.stamp{border:1.5px dashed var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);line-height:1.3;min-width:0}
.stamp b{display:block;font-family:var(--f-mono);font-size:13px}
.stamp.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
.stamp.done{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.q{font-size:19px;font-weight:700;margin:6px 0 16px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:8px;padding:12px 20px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.full{width:100%}
.btn.accent{background:var(--accent);color:#fff}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}

/* multiple choice */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none;width:18px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

/* feedback */
.fb{margin-top:16px;border-radius:8px;padding:14px 16px;font-size:15px}
.fb.ok{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb.neutral{background:var(--paper);border-left:4px solid var(--muted)}
.fb strong{display:block;margin-bottom:4px}

/* sort (lifecycle) */
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:13px;color:var(--muted);margin-bottom:14px}
.srow{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow .lbl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;font-weight:500}
.code{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ctrl)}
.code.p{color:var(--proc)}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sbtn{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:6px 0;font-weight:700;font-size:15px}
.sbtn.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sbtn.ans{outline:2px solid var(--good);outline-offset:1px}
.srow .note{font-size:13px;margin-top:6px}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start;min-width:0}
.mhead{font-size:12px;font-weight:700;letter-spacing:.08em;padding-bottom:4px;border-bottom:2px solid}
.mhead.c{color:var(--ctrl);border-color:var(--ctrl)}
.mhead.p{color:var(--proc);border-color:var(--proc)}
.mi{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px 9px 10px;font-size:14px;line-height:1.45;min-height:64px;width:100%}
.mi .code{display:block;font-size:12px}
.mi.c.sel{border-color:var(--ctrl);background:var(--ctrl-soft)}
.mi.paired.c{border-color:var(--ctrl)}
.mi.paired.p{border-color:var(--proc)}
.mi .tag{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center}
.mi.right{background:var(--good-soft);border-color:var(--good)}
.mi.wrong{background:var(--bad-soft);border-color:var(--bad)}
.mhint{font-size:13px;color:var(--muted);margin:-6px 0 12px}

/* tri (rapid fire) */
.tri-item{font-size:22px;font-weight:900;text-align:center;padding:22px 8px;border:1.5px dashed var(--line);border-radius:8px;margin-bottom:14px}
.tri-count{text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-bottom:8px}
.tri-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:14px 4px;font-weight:700;font-size:15px}
.tc.c{border-color:var(--ctrl);color:var(--ctrl)}
.tc.p{border-color:var(--proc);color:var(--proc)}
.tc.b{border-color:var(--muted)}
.tc.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tc.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dots{display:flex;gap:5px;justify-content:center;margin-top:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)}

/* start + intro */
.hero{padding:6px 0 20px}
.hero h1{font-size:28px;font-weight:900;letter-spacing:.01em}
.hero p{color:var(--muted);margin:8px 0 0}
.levels{display:grid;gap:8px;margin:18px 0}
.lv{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lv .n{font-family:var(--f-mono);font-weight:600;font-size:22px;color:var(--accent)}
.lv .t{font-weight:700}
.lv .s{font-size:13px;color:var(--muted)}
.lv .m{font-size:12px;color:var(--muted);text-align:right}
.intro{text-align:center;padding:36px 20px}
.intro .big{font-family:var(--f-mono);font-size:64px;font-weight:600;color:var(--accent);line-height:1}
.intro h2{font-size:26px;font-weight:900;margin-top:10px}
.intro .src{font-size:13px;color:var(--muted);margin-top:6px}
.intro .how{margin:18px auto 0;max-width:30em;font-size:15px}

/* end */
.result{text-align:center;padding:28px 18px}
.result .nm{font-size:18px;font-weight:700}
.result .pts{font-family:var(--f-mono);font-size:76px;font-weight:600;line-height:1;margin:10px 0 2px}
.result .of{color:var(--muted);font-size:14px}
.rank{display:inline-block;margin-top:14px;border:3px solid var(--accent);color:var(--accent);font-weight:900;font-size:20px;padding:6px 18px;border-radius:6px;transform:rotate(-3deg);letter-spacing:.06em}
.bars{display:grid;gap:10px;margin-top:22px;text-align:left}
.bar{display:grid;grid-template-columns:8.6em 1fr 4.2em;white-space:nowrap;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--paper);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;background:var(--ink);border-radius:5px}
.bar .v{font-family:var(--f-mono);text-align:right;font-size:13px}
.show{margin-top:20px;font-size:15px;font-weight:700}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
.confirm{margin-top:10px;font-size:14px;color:var(--bad)}

/* host */
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);margin:14px 0 20px;overflow-x:auto}
.tab{border:none;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.host-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.host-grid{grid-template-columns:1fr}}
#qrbox{display:grid;place-items:center;background:#fff;border-radius:var(--r);padding:20px;min-height:200px}
#qrbox img,#qrbox canvas{max-width:100%;height:auto}
.qr-empty{color:#596474;font-size:14px;text-align:center}
.linktext{font-family:var(--f-mono);font-size:13px;word-break:break-all;color:var(--muted);margin-top:10px}
.steps{padding-left:1.2em;margin:8px 0 0;font-size:15px}
.steps li{margin-bottom:6px}
.timer{font-family:var(--f-mono);font-size:72px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.timer.low{color:var(--accent)}
.sb-row{display:grid;grid-template-columns:2em 1fr 6.5em 2.4em;gap:8px;align-items:center;margin-bottom:8px}
.sb-row .i{font-family:var(--f-mono);color:var(--muted);text-align:center}
.sb-row input.s{font-family:var(--f-mono);text-align:right}
.x{border:1.5px solid var(--line);background:var(--card);border-radius:8px;height:44px}
.board{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:3em 1fr auto;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 18px;font-size:22px;font-weight:700}
.brow .rk{font-family:var(--f-mono);color:var(--muted);font-size:20px}
.brow .sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.brow.top1{border-color:var(--accent);background:var(--accent-soft)}
.brow.top1 .rk{color:var(--accent)}
.rv-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.rv-card .q{font-size:22px}
.rv-ans{display:none}
.reveal .rv-ans{display:block}
.rv-list{display:grid;gap:8px;font-size:17px}
.rv-list .r{padding:8px 12px;border-radius:6px;border:1.5px solid var(--line)}
.reveal .rv-list .r.ok{border-color:var(--good);background:var(--good-soft);font-weight:700}
.rv-nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.rv-pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:16px}
.rv-pairs div{padding:8px 10px;border:1.5px solid var(--line);border-radius:6px}
.hidden-ans{color:var(--muted);font-size:14px}
.reveal .hidden-ans{display:none}
@media (prefers-reduced-motion: no-preference){.card,.intro,.result{animation:rise .28s ease-out}}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
</style>

<script>
/* ---------- 題庫（依講師補充教材 5 張投影片；ISO/IEC 27701:2025 中文條文本 v1.2） ---------- */
const LEVELS = [
  {n:1, name:"看數字猜角色", src:"一張圖看懂附錄 A、B", how:"先猜再聽講解：數字會告訴你控制者和處理者各自的重心在哪裡。"},
  {n:2, name:"生命週期歸位", src:"A.1 控制者：資料生命週期", how:"一筆個資從規劃走到結束。把控制措施放回它最主要的那一站。"},
  {n:3, name:"鏡像連連看", src:"A.1 與 A.2 鏡像對照", how:"同一件事，控制者「決定」，處理者「配合並證明」。把兩邊對應的條文連起來。"},
  {n:4, name:"誰的責任？", src:"控制者獨有 vs. 處理者獨有", how:"快問快答：看到一項控制措施，判斷它屬於哪一邊。"},
  {n:5, name:"稽核員上場", src:"跨境傳輸與安全底座", how:"換你當稽核員：遇到這些情境，你會怎麼判斷？"}
];
const STAGES = ["① 規劃","② 蒐集","③ 處理利用","④ 委外共享","⑤ 當事人權利","⑥ 保存結束"];
const TRI = ["控制者獨有","處理者獨有","兩邊都有"];
const BLOCKS = ["① 收集和處理條件","② 對 PII 主體的義務","③ 隱私設計與預設隱私","④ PII 的共享、傳輸和揭露"];

const TASKS = [
  // 第 1 關
  {lv:1,type:"mc",q:"表 A.1「PII 控制者」共 31 項，分成四個區塊。哪一個區塊的控制措施最多？",opts:BLOCKS,a:1,
   exp:"② 對 PII 主體的義務有 10 項（告知、撤回同意、反對、存取更正刪除、自動化決策…）。控制者的重心在「對當事人」。其餘：① 8 項、③ 9 項、④ 4 項。"},
  {lv:1,type:"mc",q:"表 A.2「PII 處理者」共 18 項。哪一個區塊最多？",opts:BLOCKS,a:3,
   exp:"④ 有 8 項（跨境告知、揭露請求、分包商管理）。處理者的重心在「對客戶與分包商」。② 只有 1 項，因為回應當事人是控制者的責任，處理者只負責協助。"},
  {lv:1,type:"mc",q:"附錄 A 三張表（A.1 控制者、A.2 處理者、A.3 共通安全考量）合計有幾項控制措施？",opts:["49 項","60 項","78 項","93 項"],a:2,
   exp:"31 + 18 + 29 = 78。A.3 的 29 項是兩種角色都適用的資訊安全基座：分類、存取、加密、日誌、事故、備份、供應商。"},
  {lv:1,type:"mc",q:"附錄 A 和附錄 B 的關係，哪一個說法正確？",opts:["A 說「怎麼做」，B 說「做什麼」","A 說「做什麼」，B 說「怎麼做」，編號一一對應","附錄 B 是參考性附錄，可以不看","A、B 編號各自獨立，沒有對應關係"],a:1,
   exp:"A.1.2.2 控制措施 ↔ B.1.2.2 實作指引。附錄 A、B 都是規範性附錄：稽核依據看 A，證據長相參考 B。"},
  // 第 2 關
  {lv:2,type:"sort",q:"這項控制措施最主要落在生命週期的哪一站？",
   items:[{c:"A.1.4.8",t:"保留期限",a:5},{c:"A.1.2.6",t:"隱私影響評鑑",a:0},{c:"A.1.3.7",t:"存取、更正或刪除",a:4},{c:"A.1.2.5",t:"取得並記錄同意",a:1},{c:"A.1.5.4",t:"PII 傳輸記錄",a:3},{c:"A.1.4.5",t:"PII 最小化目標",a:2}],
   exp:"用途、合法依據、隱私影響評鑑在「還沒蒐集前」就要完成。這是講師依業務流程的教學排序，不是標準規定的實施順序。"},
  {lv:2,type:"mc",q:"哪一項控制措施「貫穿生命週期全程」，也是稽核員第一份要的文件？",opts:["A.1.3.10 處理請求","A.1.2.2 識別並記錄用途","A.1.2.9 與處理 PII 相關的記錄（處理活動清冊）","A.1.4.9 處置"],a:2,
   exp:"處理活動清冊（RoPA）把每一站的目的、依據、對象、保存期限都記在這裡。"},
  {lv:2,type:"mc",q:"「⑤ 當事人權利」這一站有什麼特別之處？",opts:["只會在保存結束後才發生","隨時可能發生，所以要有常設的請求處理流程","由處理者負責直接回應","只有在取得同意時才需要處理"],a:1,
   exp:"第 5 站不是第 5 步才發生。A.1.3.10 處理請求，讓組織隨時接得住當事人的請求。"},
  // 第 3 關
  {lv:3,type:"match",q:"把控制者的條文，連到處理者對應的條文。",
   left:[{c:"A.1.2.2",t:"識別並記錄用途"},{c:"A.1.2.7",t:"與 PII 處理者的合約"},{c:"A.1.3.2～3.10",t:"回應當事人"},{c:"A.1.4.9",t:"處置"},{c:"A.1.5.5",t:"向第三方揭露的記錄"}],
   right:[{c:"A.2.2.3",t:"組織的用途（只依客戶指示）"},{c:"A.2.2.2",t:"客戶協議"},{c:"A.2.3.2",t:"協助客戶履行對 PII 主體的義務"},{c:"A.2.4.3",t:"PII 的返還、傳輸或處置"},{c:"A.2.5.4",t:"向第三方揭露 PII 的記錄"}],
   order:[3,0,4,1,2],
   exp:"控制者「決定」，處理者「配合並證明」。例如用途由控制者決定（A.1.2.2），處理者只能用在客戶指示的用途（A.2.2.3）。"},
  {lv:3,type:"mc",q:"一家公司自己的會員資料，和幫客戶代管的資料，分別是什麼角色？",opts:["兩者都是控制者","會員資料是控制者；代管資料是處理者","會員資料是處理者；代管資料是控制者","兩者都是處理者"],a:1,

const PTS = 10;
const maxOf = t => t.type==="mc" ? PTS : (t.items||t.left).length*PTS;
const TOTAL = TASKS.reduce((s,t)=>s+maxOf(t),0);
const lvMax = n => TASKS.filter(t=>t.lv===n).reduce((s,t)=>s+maxOf(t),0);

/* ---------- 儲存（僅此瀏覽器） ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");

/* =================== 學員端 =================== */
let S = store.get("q27701", null) || fresh();
function fresh(){return {name:"",phase:"start",i:0,res:[],tmp:null,checked:false,confirmReset:false}}
function save(){store.set("q27701",S)}
const score = () => S.res.reduce((s,r)=>s+(r?r.got:0),0);
function initTmp(t){
  if(t.type==="mc") return {pick:null};
  if(t.type==="sort") return {picks:{}};
  if(t.type==="match") return {sel:null,pairs:{}};
  if(t.type==="tri") return {k:0,picks:[],showing:false};
}
function goTask(i){
  S.i=i; S.checked=false; S.tmp=initTmp(TASKS[i]);
  S.phase = (i===0 || TASKS[i-1].lv!==TASKS[i].lv) ? "intro" : "task";
  save(); render();
}

function trackHTML(){
  const cur = S.phase==="end" ? 6 : TASKS[S.i].lv;
  return `<div class="track">${LEVELS.map(l=>`<div class="stamp ${l.n<cur?"done":l.n===cur?"on":""}"><b>${l.n<cur?"✓":"0"+l.n}</b>${l.name}</div>`).join("")}</div>`;
}
function topHTML(){
  return `<div class="top"><div><div class="eyebrow">ISO/IEC 27701:2025 附錄 A、B</div><div class="who">${esc(S.name)}</div></div><div class="score-pill">${score()} 分</div></div>`;
}

function renderStart(){
  app.innerHTML = `
  <div class="hero">
    <div class="eyebrow">課堂闖關｜ISO/IEC 27701:2025</div>
    <h1>附錄 A 五關挑戰</h1>
    <p>用手機闖 5 關，把附錄 A 的 78 項控制措施放回業務流程。答對一項得 ${PTS} 分，滿分 ${TOTAL} 分。</p>
  </div>
  <div class="card">
    <label for="nm" class="eyebrow">你的暱稱（會顯示在成績畫面）</label>
    <input id="nm" maxlength="12" placeholder="例如：小明" value="${esc(S.name)}" style="margin-top:8px">
    <div class="levels">${LEVELS.map(l=>`<div class="lv"><div class="n">0${l.n}</div><div><div class="t">${l.name}</div><div class="s">${l.src}</div></div><div class="m">${lvMax(l.n)} 分</div></div>`).join("")}</div>
    <button class="btn full accent" id="go">開始闖關</button>
  </div>
  <p class="foot">講師補充教材｜非官方課程內容、不在考試範圍｜依 ISO/IEC 27701:2025 中文條文本 v1.2 整理</p>`;
  const nm=document.getElementById("nm"), go=document.getElementById("go");
  const upd=()=>{go.disabled=!nm.value.trim()}; upd();
  nm.oninput=upd;
  nm.onkeydown=e=>{if(e.key==="Enter"&&nm.value.trim())go.click()};
  go.onclick=()=>{S.name=nm.value.trim().slice(0,12);S.res=[];goTask(0)};
}

function renderIntro(){
  const l = LEVELS[TASKS[S.i].lv-1];
  app.innerHTML = topHTML()+trackHTML()+`
  <div class="card intro">
    <div class="eyebrow">第 ${l.n} 關</div>
    <div class="big">0${l.n}</div>
    <h2>${l.name}</h2>
    <div class="src">對應投影片：${l.src}｜本關 ${lvMax(l.n)} 分</div>
    <p class="how">${l.how}</p>
    <div class="actions"><button class="btn full" id="go">進入第 ${l.n} 關</button></div>
  </div>`;
  document.getElementById("go").onclick=()=>{S.phase="task";save();render()};
}

function qHead(t){
  const inLv = TASKS.filter(x=>x.lv===t.lv), k = inLv.indexOf(t)+1;
  return `<div class="meta"><span>第 ${t.lv} 關．${LEVELS[t.lv-1].name}</span><span class="mono">${k} / ${inLv.length}</span></div><div class="q">${t.q}</div>`;
}
function nextBtn(){
  const last = S.i===TASKS.length-1;
  return `<div class="actions"><button class="btn full" id="next">${last?"看我的成績":"下一題"}</button></div>`;
}
function bindNext(){
  const b=document.getElementById("next"); if(!b) return;
  b.onclick=()=>{ if(S.i===TASKS.length-1){S.phase="end";save();render()} else goTask(S.i+1) };
}
function fbBox(got,max,exp){
  const cls = got===max?"ok":got===0?"no":"neutral";
  const head = max===PTS ? (got?"答對了！+"+PTS:"答錯了") : `得到 ${got} / ${max} 分`;
  return `<div class="fb ${cls}"><strong>${head}</strong>${exp}</div>`;
}

function renderMC(t){
  const T=S.tmp, done=S.checked;
  const opts = t.opts.map((o,j)=>{
    let c = "";
    if(done){ if(j===t.a) c="right"; else if(j===T.pick) c="wrong"; }
    else if(j===T.pick) c="sel";
    return `<button class="opt ${c}" data-j="${j}" ${done?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`;
  }).join("");
  const r=S.res[S.i];
  app.innerHTML = topHTML()+trackHTML()+`<div class="card">${qHead(t)}<div class="opts">${opts}</div>
    ${done? fbBox(r.got,PTS,t.exp)+nextBtn() : `<div class="actions"><button class="btn full" id="chk" ${T.pick===null?"disabled":""}>送出答案</button></div>`}</div>`;
  if(!done){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{T.pick=+b.dataset.j;save();render()});
    document.getElementById("chk").onclick=()=>{S.res[S.i]={got:T.pick===t.a?PTS:0,max:PTS};S.checked=true;save();render()};
  } else bindNext();
}

function renderSort(t){
  const T=S.tmp, done=S.checked;
  const rows = t.items.map((it,j)=>{
    const p=T.picks[j];
    const st = done ? (p===it.a?"right":"wrong") : "";
    const btns = STAGES.map((s,k)=>`<button class="sbtn ${p===k?"sel":""} ${done&&k===it.a&&p!==it.a?"ans":""}" data-j="${j}" data-k="${k}" ${done?"disabled":""} aria-label="${s}">${s.slice(0,1)}</button>`).join("");
    const note = done && p!==it.a ? `<div class="note">正確：${STAGES[it.a]}</div>` : "";
    return `<div class="srow ${st}"><div class="lbl"><span class="code">${it.c}</span><span>${it.t}</span></div><div class="stages">${btns}</div>${note}</div>`;
  }).join("");
  const all = Object.keys(T.picks).length===t.items.length;
  const r=S.res[S.i];
  app.innerHTML = topHTML()+trackHTML()+`<div class="card">${qHead(t)}
    <div class="legend">${STAGES.map(s=>`<span>${s}</span>`).join("")}</div>${rows}
    ${done? fbBox(r.got,r.max,t.exp)+nextBtn() : `<div class="actions"><button class="btn full" id="chk" ${all?"":"disabled"}>送出（已選 ${Object.keys(T.picks).length} / ${t.items.length}）</button></div>`}</div>`;
  if(!done){
    app.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{T.picks[b.dataset.j]=+b.dataset.k;save();render()});
    document.getElementById("chk").onclick=()=>{
      const got=t.items.reduce((s,it,j)=>s+(T.picks[j]===it.a?PTS:0),0);
      S.res[S.i]={got,max:maxOf(t)};S.checked=true;save();render()};
  } else bindNext();
}

function renderMatch(t){
  const T=S.tmp, done=S.checked;
  // pairs: leftIdx -> rightIdx ; tag numbers by left order
  const rightToLeft={}; Object.entries(T.pairs).forEach(([l,r])=>rightToLeft[r]=+l);
  const L = t.left.map((it,j)=>{
    const paired = T.pairs[j]!==undefined;
    let c = paired?"paired":""; if(T.sel===j) c+=" sel";
    if(done) c += T.pairs[j]===j ? " right":" wrong";
    return `<button class="mi c ${c}" data-l="${j}" ${done?"disabled":""}>${paired?`<span class="tag">${j+1}</span>`:""}<span class="code">${it.c}</span>${it.t}</button>`;
  }).join("");
  const R = t.order.map(ri=>{
    const it=t.right[ri], l=rightToLeft[ri], paired=l!==undefined;
    let c = paired?"paired":""; if(done) c += (paired && l===ri) ? " right":" wrong";
    return `<button class="mi p ${c}" data-r="${ri}" ${done?"disabled":""}>${paired?`<span class="tag">${l+1}</span>`:""}<span class="code p">${it.c}</span>${it.t}</button>`;
  }).join("");
  const all = Object.keys(T.pairs).length===t.left.length;
  const r=S.res[S.i];
  let fix="";
  if(done){
    const wrong=t.left.map((it,j)=>T.pairs[j]!==j?`<div><span class="code">${it.c}</span> ↔ <span class="code p">${t.right[j].c}</span> ${t.right[j].t}</div>`:"").join("");
    if(wrong) fix=`<div class="fb neutral"><strong>正確配對</strong>${wrong}</div>`;
  }
  app.innerHTML = topHTML()+trackHTML()+`<div class="card">${qHead(t)}
    <p class="mhint">先點左邊的控制者條文，再點右邊對應的處理者條文。點已配對的左邊項目可以取消。</p>
    <div class="mgrid"><div class="mcol"><div class="mhead c">控制者 表 A.1</div>${L}</div><div class="mcol"><div class="mhead p">處理者 表 A.2</div>${R}</div></div>
    ${done? fix+fbBox(r.got,r.max,t.exp)+nextBtn() : `<div class="actions"><button class="btn full" id="chk" ${all?"":"disabled"}>送出（已連 ${Object.keys(T.pairs).length} / ${t.left.length}）</button></div>`}</div>`;
  if(!done){
    app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.l;
      if(T.pairs[j]!==undefined){delete T.pairs[j];T.sel=null}
      else T.sel = T.sel===j?null:j;
      save();render()});
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
      if(T.sel===null) return;
      const ri=+b.dataset.r;
      Object.keys(T.pairs).forEach(k=>{if(T.pairs[k]===ri)delete T.pairs[k]});
      T.pairs[T.sel]=ri; T.sel=null; save();render()});
    document.getElementById("chk").onclick=()=>{
      const got=t.left.reduce((s,_,j)=>s+(T.pairs[j]===j?PTS:0),0);
      S.res[S.i]={got,max:maxOf(t)};S.checked=true;save();render()};
  } else bindNext();
}

function renderTri(t){
  const T=S.tmp, n=t.items.length;
  const dots = t.items.map((it,j)=>`<span class="dot ${T.picks[j]===undefined?"":T.picks[j]===it.a?"ok":"no"}"></span>`).join("");
  let body;
  if(S.checked){
    const r=S.res[S.i];
    const list=t.items.map((it,j)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><span>${T.picks[j]===it.a?"✓":"✗"} ${it.t}</span><span style="color:var(--muted);white-space:nowrap">${TRI[it.a]}</span></div>`).join("");
    body = `<div>${list}</div>${fbBox(r.got,r.max,t.exp)}${nextBtn()}`;
  } else {
    const it=t.items[T.k], p=T.picks[T.k];
    const ch = TRI.map((c,k)=>{
      let cls=["c","p","b"][k];
      if(T.showing){ if(k===it.a) cls+=" right"; else if(k===p) cls+=" wrong"; }
      return `<button class="tc ${cls}" data-k="${k}" ${T.showing?"disabled":""}>${c}</button>`;
    }).join("");
    const fb = T.showing ? `<div class="fb ${p===it.a?"ok":"no"}"><strong>${p===it.a?"答對了！+"+PTS:"答錯了，正確是「"+TRI[it.a]+"」"}</strong><span class="mono">${it.c}</span></div>
      <div class="actions"><button class="btn full" id="nx">${T.k===n-1?"看本關結果":"下一項"}</button></div>` : "";
    body = `<div class="tri-count">${T.k+1} / ${n}</div><div class="tri-item">${it.t}</div><div class="tri-choices">${ch}</div>${fb}`;
  }
  app.innerHTML = topHTML()+trackHTML()+`<div class="card">${qHead(t)}${body}<div class="dots">${dots}</div></div>`;
  if(S.checked){bindNext();return}
  app.querySelectorAll(".tc").forEach(b=>b.onclick=()=>{T.picks[T.k]=+b.dataset.k;T.showing=true;
    const got=t.items.reduce((s,it,j)=>s+(T.picks[j]===it.a?PTS:0),0); S.res[S.i]={got,max:maxOf(t)};
    save();render()});
  const nx=document.getElementById("nx");
  if(nx) nx.onclick=()=>{ if(T.k===n-1){S.checked=true} else {T.k++;T.showing=false} save();render() };
}

function rankOf(p){ return p>=0.9?"主導稽核員":p>=0.7?"稽核員":p>=0.5?"見習稽核員":"再闖一次"; }
function renderEnd(){
  const sc=score(), pct=sc/TOTAL;
  const bars = LEVELS.map(l=>{
    const got=TASKS.reduce((s,t,i)=>s+(t.lv===l.n&&S.res[i]?S.res[i].got:0),0), mx=lvMax(l.n);
    return `<div class="bar"><span>0${l.n} ${l.name}</span><span class="tr"><span class="fl" style="display:block;width:${Math.round(got/mx*100)}%"></span></span><span class="v">${got}/${mx}</span></div>`;
  }).join("");
  app.innerHTML = trackHTML()+`<div class="card result">
    <div class="eyebrow">闖關完成</div>
    <div class="nm">${esc(S.name)}</div>
    <div class="pts">${sc}</div>
    <div class="of">滿分 ${TOTAL} 分．答對率 ${Math.round(pct*100)}%</div>
    <div class="rank">${rankOf(pct)}</div>
    <div class="bars">${bars}</div>
    <div class="show">請把這個畫面舉起來給講師登記分數</div>
    <div class="actions"><button class="btn ghost full" id="again">${S.confirmReset?"確定清除成績，重新開始":"重新挑戰"}</button></div>
    ${S.confirmReset?`<div class="confirm">再按一次會清除目前成績。</div>`:""}
  </div>
  <p class="foot">講師補充教材｜非官方課程內容、不在考試範圍</p>`;
  document.getElementById("again").onclick=()=>{
    if(!S.confirmReset){S.confirmReset=true;save();render();return}
    const nm=S.name; S=fresh(); S.name=nm; save(); render();
  };
}

const H = store.get("q27701host", null) || {tab:"qr",link:"",rows:Array.from({length:7},()=>({n:"",s:""})),board:false,rv:0,reveal:false,secs:900,left:900,clear:false};
let tick=null;
function hsave(){store.set("q27701host",H)}
function fmt(s){const m=Math.floor(s/60),x=s%60;return `${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`}

function renderHost(){
  app.className="wrap wide";
  const tabs=[["qr","掃碼入場"],["score","計時與排行榜"],["review","逐題檢討"]];
  let body="";
  if(H.tab==="qr") body=hostQR();
  if(H.tab==="score") body=hostScore();
  if(H.tab==="review") body=hostReview();
  app.innerHTML=`<div class="top"><div><div class="eyebrow">講師主控台</div><h2 style="font-size:24px;font-weight:900">附錄 A 五關挑戰</h2></div><div class="score-pill">${TASKS.length} 題組．滿分 ${TOTAL}</div></div>
  <div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${H.tab===k?"on":""}" data-tab="${k}">${v}</button>`).join("")}</div>${body}`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{H.tab=b.dataset.tab;hsave();renderHost()});
  if(H.tab==="qr") bindQR();
  if(H.tab==="score") bindScore();
  if(H.tab==="review") bindReview();
}
function hostQR(){
  return `<div class="host-grid">
    <div id="qrbox"><div class="qr-empty">貼上學員連結後，這裡會顯示 QR Code</div></div>
    <div>
      <h3 style="font-size:20px">學員掃碼入場</h3>
      <ol class="steps">
        <li>開啟這個頁面的公開分享連結，複製網址。</li>
        <li>貼到下方；學員連結<strong>不要</strong>帶 <span class="mono">#host</span>，系統會自動去掉。</li>
        <li>投影這一頁，學員用手機相機掃描即可，不需要登入。</li>
      </ol>
      <label for="lk" class="eyebrow" style="display:block;margin-top:16px">學員連結</label>
      <input id="lk" placeholder="https://claude.ai/…" value="${esc(H.link)}" style="margin-top:6px">
      <div class="actions"><button class="btn" id="mk">產生 QR Code</button></div>
      <div class="linktext" id="lt"></div>
    </div></div>`;
}
function drawQR(){
  const box=document.getElementById("qrbox"); if(!box) return;
  const url=H.link.trim().replace(/#host$/,"");
  if(!url){return}
  box.innerHTML="";
  if(typeof QRCode==="undefined"){box.innerHTML=`<div class="qr-empty">QR 元件載入失敗，請直接把下方連結貼給學員。</div>`}
  else new QRCode(box,{text:url,width:340,height:340,correctLevel:QRCode.CorrectLevel.M});
  document.getElementById("lt").textContent=url;
}
function bindQR(){
  const lk=document.getElementById("lk");
  document.getElementById("mk").onclick=()=>{H.link=lk.value;hsave();drawQR()};
  drawQR();
}
function hostScore(){
  const ranked=H.rows.filter(r=>r.n.trim()).map(r=>({n:r.n,s:Number(r.s)||0})).sort((a,b)=>b.s-a.s);
  let rk=0,prev=null;
  const board=ranked.map((r,i)=>{if(r.s!==prev){rk=i+1;prev=r.s}return `<div class="brow ${rk===1?"top1":""}"><span class="rk">#${rk}</span><span>${esc(r.n)}</span><span class="sc">${r.s}</span></div>`}).join("") || `<p class="hidden-ans">左側輸入學員暱稱與分數後，這裡會依分數排序。</p>`;
  return `<div class="host-grid">
    <div>
      <div class="card" style="text-align:center">
        <div class="eyebrow">闖關計時</div>
        <div class="timer ${H.left<=60?"low":""}" id="tm">${fmt(H.left)}</div>
        <div class="actions"><button class="btn" id="tgo">${tick?"暫停":"開始"}</button><button class="btn ghost" id="trs">重設</button>
          <button class="btn ghost" id="tm10">10 分</button><button class="btn ghost" id="tm15">15 分</button><button class="btn ghost" id="tm20">20 分</button></div>
      </div>
      <h3 style="font-size:18px;margin:22px 0 10px">登記分數</h3>
      ${H.rows.map((r,i)=>`<div class="sb-row"><span class="i">${i+1}</span><input id="sbn${i}" data-i="${i}" data-f="n" placeholder="暱稱" value="${esc(r.n)}"><input id="sbs${i}" class="s" data-i="${i}" data-f="s" inputmode="numeric" placeholder="分數" value="${esc(r.s)}"><button class="x" data-del="${i}" aria-label="刪除第 ${i+1} 列">✕</button></div>`).join("")}
      <div class="actions"><button class="btn ghost" id="add">新增一列</button><button class="btn ghost" id="clr">${H.clear?"確定清空":"清空分數"}</button></div>
    </div>
    <div>
      <div class="actions" style="margin-top:0"><button class="btn accent full" id="bd">${H.board?"隱藏排名":"揭曉排名"}</button></div>
      <div class="board" style="margin-top:14px">${H.board?board:`<p class="hidden-ans" style="text-align:center;padding:40px 0">排名已隱藏，按「揭曉排名」公布。</p>`}</div>
    </div></div>`;
}
function bindScore(){
  app.querySelectorAll(".sb-row input").forEach(inp=>inp.oninput=()=>{H.rows[+inp.dataset.i][inp.dataset.f]=inp.value;hsave();
    if(H.board){const b=app.querySelector(".board");const tmp=document.createElement("div");tmp.innerHTML=hostScore();b.innerHTML=tmp.querySelector(".board").innerHTML}});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{H.rows.splice(+b.dataset.del,1);hsave();renderHost()});
  document.getElementById("add").onclick=()=>{H.rows.push({n:"",s:""});hsave();renderHost()};
  document.getElementById("clr").onclick=()=>{if(!H.clear){H.clear=true;renderHost();return}H.rows=Array.from({length:7},()=>({n:"",s:""}));H.clear=false;H.board=false;hsave();renderHost()};
  document.getElementById("bd").onclick=()=>{H.board=!H.board;hsave();renderHost()};
  document.getElementById("tgo").onclick=()=>{
    if(tick){clearInterval(tick);tick=null}
    else tick=setInterval(()=>{H.left=Math.max(0,H.left-1);hsave();const el=document.getElementById("tm");if(el){el.textContent=fmt(H.left);el.classList.toggle("low",H.left<=60)}if(H.left===0){clearInterval(tick);tick=null;if(H.tab==="score")renderHost()}},1000);
    renderHost()};
  document.getElementById("trs").onclick=()=>{if(tick){clearInterval(tick);tick=null}H.left=H.secs;hsave();renderHost()};
  [10,15,20].forEach(m=>document.getElementById("tm"+m).onclick=()=>{if(tick){clearInterval(tick);tick=null}H.secs=H.left=m*60;hsave();renderHost()});
}
function reviewBody(t){
  if(t.type==="mc") return `<div class="rv-list">${t.opts.map((o,j)=>`<div class="r ${j===t.a?"ok":""}">${"ABCD"[j]}．${o}</div>`).join("")}</div>`;
  if(t.type==="sort") return `<div class="rv-list">${t.items.map(it=>`<div class="r ok" style="display:flex;justify-content:space-between;gap:10px"><span><span class="code">${it.c}</span> ${it.t}</span><span class="rv-ans">${STAGES[it.a]}</span></div>`).join("")}</div>`;
  if(t.type==="match") return `<div class="rv-pairs">${t.left.map((it,j)=>`<div><span class="code">${it.c}</span> ${it.t}</div><div><span class="rv-ans"><span class="code p">${t.right[j].c}</span> ${t.right[j].t}</span><span class="hidden-ans">？</span></div>`).join("")}</div>`;
  if(t.type==="tri") return `<div class="rv-list">${t.items.map(it=>`<div class="r ok" style="display:flex;justify-content:space-between;gap:10px"><span>${it.t}</span><span class="rv-ans">${TRI[it.a]}．<span class="mono" style="font-size:13px">${it.c}</span></span></div>`).join("")}</div>`;
}
function hostReview(){
  const t=TASKS[H.rv];
  return `<div class="rv-nav"><button class="btn ghost" id="pv" ${H.rv===0?"disabled":""}>上一題</button>
    <span class="mono">${H.rv+1} / ${TASKS.length}．第 ${t.lv} 關 ${LEVELS[t.lv-1].name}</span>
    <button class="btn ghost" id="nx2" ${H.rv===TASKS.length-1?"disabled":""}>下一題</button></div>
    <div class="rv-card ${H.reveal?"reveal":""}">
      <div class="eyebrow">對應投影片：${LEVELS[t.lv-1].src}</div>
      <div class="q">${t.q}</div>${reviewBody(t)}
      <div class="rv-ans fb ok" style="font-size:17px"><strong>講解</strong>${t.exp}</div>
    </div>
    <div class="actions"><button class="btn accent" id="rvl">${H.reveal?"隱藏答案":"揭曉答案"}</button></div>`;
}
function bindReview(){
  document.getElementById("pv").onclick=()=>{H.rv--;H.reveal=false;hsave();renderHost()};
  document.getElementById("nx2").onclick=()=>{H.rv++;H.reveal=false;hsave();renderHost()};
  document.getElementById("rvl").onclick=()=>{H.reveal=!H.reveal;hsave();renderHost()};
}

/* =================== 路由 =================== */
function render(){
  if(location.hash==="#host"){renderHost();return}
  app.className="wrap";
  if(S.phase==="start") return renderStart();
  if(S.phase==="intro") return renderIntro();
  if(S.phase==="end") return renderEnd();
  const t=TASKS[S.i]; if(!S.tmp) S.tmp=initTmp(t);
  ({mc:renderMC,sort:renderSort,match:renderMatch,tri:renderTri})[t.type](t);
  const key=S.i+"|"+S.checked+"|"+(S.tmp&&S.tmp.k);
  if(key!==lastKey && !(S.tmp&&S.tmp.showing)){window.scrollTo(0,0)}
  lastKey=key;
}
let lastKey="";
window.addEventListener("hashchange",render);
render();
</script>
